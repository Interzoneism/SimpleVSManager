[package]
name = "simple-vs-manager"
description = "Simple VS Manager: a cross-platform Vintage Story mod manager."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "svsm_app"
crate-type = ["staticlib", "cdylib", "rlib"]

# An example, not a [[bin]]: Tauri would otherwise bundle it into every installer.
[[example]]
name = "export-bindings"
path = "examples/export_bindings.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
svsm-core = { workspace = true, features = ["specta"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
specta.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri = { version = "2", features = [] }
notify-debouncer-full = "0.8"
tokio = { version = "1", features = ["sync"] }
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
specta-typescript = "=0.0.9"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tracing-appender = "0.2.5"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "charset", "system-proxy", "gzip", "json"] }
semver = "1"
minisign-verify = "0.2"
base64 = "0.23.1"

# In-app updates: Windows swaps its own exe, macOS and the Linux AppImage use Tauri's updater.
[target.'cfg(windows)'.dependencies]
self-replace = "1"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[dev-dependencies]
mockito = "1.7.2"
tauri = { version = "2", features = ["test"] }
tempfile = "3.27.0"
zip = { version = "7.3.0", default-features = false, features = ["deflate"] }
