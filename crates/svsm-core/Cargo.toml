[package]
name = "svsm-core"
description = "Platform-independent core logic for Simple VS Manager (no UI, no Tauri)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = []
# Derive specta::Type on public data types so the Tauri app can generate TypeScript bindings.
specta = ["dep:specta"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
specta = { workspace = true, optional = true }
dirs = "6"
pelite = "0.10"
json5 = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
rayon = "1"
trash = "5"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "charset", "system-proxy", "gzip"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
lopdf = { version = "0.42.0", default-features = false }
brotli = "9.1.3"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
uuid = { version = "1.26.1", features = ["v4"] }
sha2 = "0.10"
serde_norway = "0.9.42"

[dev-dependencies]
mockito = "1.7.2"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
# examples/moddb_live.rs uses #[tokio::main]
zip = { version = "9", default-features = false, features = ["deflate"] }
